<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Cancelled — Veloce Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--accent:#00C8FF;--bg:#080809;--muted:#8888a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:1px;margin-bottom:12px;}
  p{color:var(--muted);max-width:420px;margin:0 auto 32px;line-height:1.6;}
  a{display:inline-flex;background:var(--accent);color:var(--bg);text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:14px 28px;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
</style>
</head>
<body>
  <div>
    <h1>Checkout Cancelled</h1>
    <p>No payment was taken. Your cart is still saved if you'd like to pick up where you left off.</p>
    <a href="shop.html">Return to Cart</a>
  </div>
</body>
</html>
